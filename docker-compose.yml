version: '3.8'
services:
  ui:
    build: ./updown-ui
    volumes:
      - ./updown-ui:/app
    env_file:
      - ./updown-ui/.env
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ui-network
  api:
    build: ./updown-backend
    volumes:
      - ./updown-backend:/app
    env_file:
      - ./updown-backend/.env
    command: ['bash', './docker-entrypoint.sh']
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - api-network
      - ui-network
  db:
    image: mysql:8.0
    env_file:
      - ./updown-backend/.env
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -hlocalhost -u${MYSQL_ROOT_USER} -p${MYSQL_ROOT_PASSWORD} -e 'USE ${MYSQL_DATABASE};'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - api-network
volumes:
  mysql:

networks:
  ui-network:
    driver: bridge
  api-network:
    driver: bridge